<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" href="https://static.nowcoder.com/images/logo_87_87.png"/>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/global.css}" />
    <title>Profile Page</title>
</head>
<body>
<div class="nk-container">
    <!-- header -->
    <header class="bg-dark sticky-top" th:replace="index::header">
    </header>

    <!-- contain -->
    <div class="main">
        <div class="container">
            <!-- options -->
            <div class="position-relative">
                <ul class="nav nav-tabs">
                    <li class="nav-item">
                        <a class="nav-link active" href="profile.html">Profile</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="my-post.html">My Posts</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="my-reply.html">My replies</a>
                    </li>
                </ul>
            </div>
            <!-- Profile -->
            <div class="media mt-5">
                <img th:src="${profileUser.headerUrl}" class="align-self-start mr-4 rounded-circle" alt="user header" style="width:50px;">
                <div class="media-body">
                    <h5 class="mt-0 text-warning">
                        <span th:utext="${profileUser.username}">username</span>
                        <button type="button"
                                th:data-user-id="${profileUser.id}"
                                th:class="|btn ${hasFollowed?'btn-secondary':'btn-info'} btn-sm float-right mr-5 follow-btn|"
                                th:if="${user!=null&&user.id!=profileUser.id}"
                                th:text="${hasFollowed?'following':'follow'}">follow</button>
                    </h5>
                    <div class="text-muted mt-3">
                        <span>Registered at <i class="text-muted" th:text="${#dates.format(profileUser.createTime,'yyyy-MM-dd HH:mm:ss')}">
                            2015-06-12 15:20:12</i></span>
                    </div>
                    <div class="text-muted mt-3 mb-5">
                        <span>Followee: <a class="text-primary" href="followee.html" th:text="${followeeCount}">5</a></span>
                        <span class="ml-4">Follower: <a class="text-primary" href="follower.html" th:text="${followerCount}">123</a></span>
                        <span class="ml-4">Get <i class="text-danger" th:text="${likeCount}">87</i> likes</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- footer -->
</div>

<script src="https://code.jquery.com/jquery-3.3.1.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" crossorigin="anonymous"></script>
<script th:src="@{/js/global.js}"></script>
<script th:src="@{/js/profile.js}"></script>
</body>
</html>
