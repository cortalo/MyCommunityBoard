<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" href="https://static.nowcoder.com/images/logo_87_87.png"/>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/global.css}" />
    <link rel="stylesheet" th:href="@{/css/letter.css}" />
    <title>Notice Detail</title>
</head>
<body>
<div class="nk-container">
    <!-- header -->
    <header class="bg-dark sticky-top" th:replace="index::header">
    </header>

    <!-- Content -->
    <div class="main">
        <div class="container">
            <div class="row">
                <div class="col-8">
                    <h6><b class="square"></b> System Notice</h6>
                </div>
                <div class="col-4 text-right">
                    <button type="button" class="btn btn-secondary btn-sm" onclick="back();">Back</button>
                </div>
            </div>

            <!-- Notice List -->
            <ul class="list-unstyled mt-4">
                <li class="media pb-3 pt-3 mb-2" th:each="map:${notices}">
                    <img th:src="${map.fromUser.headerUrl}" class="mr-4 rounded-circle user-header" alt="system icon">
                    <div class="toast show d-lg-block" role="alert" aria-live="assertive" aria-atomic="true">
                        <div class="toast-header">
                            <strong class="mr-auto" th:utext="${map.fromUser.username}">from username</strong>
                            <small th:text="${#dates.format(map.notice.createTime,'yyyy-MM-dd HH:mm:ss')}">2019-04-25 15:49:32</small>
                            <button type="button" class="ml-2 mb-1 close" data-dismiss="toast" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>
                        <div class="toast-body">
								<span th:if="${topic.equals('comment')}">
                                    user
                                    <i th:utext="${map.user.username}">nowcoder</i>
                                    replies your <b th:text="${map.entityType==1?'post':'comment'}">post</b>,
                                    <a class="text-primary" th:href="@{|/discuss/detail/${map.postId}|}">click to view</a>.
                                </span>
                            <span th:if="${topic.equals('like')}">
                                    user
                                    <i th:utext="${map.user.username}">nowcoder</i>
                                    likes your <b th:text="${map.entityType==1?'post':'comment'}">post</b>,
                                    <a class="text-primary" th:href="@{|/discuss/detail/${map.postId}|}">click to view</a>.
                                </span>
                            <span th:if="${topic.equals('follow')}">
                                    user
                                    <i th:utext="${map.user.username}">nowcoder</i>
                                    follows you,
                                    <a class="text-primary" th:href="@{|/user/profile/${map.user.id}|}">click to view</a>.
                                </span>
                        </div>
                    </div>
                </li>
            </ul>
            <!-- pagination -->
            <nav class="mt-5" th:replace="index::pagination">
            </nav>
        </div>
    </div>

    <!-- footer -->
</div>

<script src="https://code.jquery.com/jquery-3.3.1.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" crossorigin="anonymous"></script>
<script th:src="@{/js/global.js}"></script>
<script th:src="@{/js/letter.js}"></script>
<script>
    function back() {
        location.href = CONTEXT_PATH + "/notice/list";
    }
</script>
</body>
</html>
